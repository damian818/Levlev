<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="heartGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Full square for maskable purpose -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <g filter="url(#shadow)">
    <!-- Heart - Scaled up from the original viewBox="0 0 100 100" -->
    <path d="M 256 430.08 C 122.88 332.8 61.44 245.76 61.44 163.84 C 61.44 97.28 112.64 51.2 174.08 51.2 C 209.92 51.2 240.64 71.68 256 97.28 C 271.36 71.68 302.08 51.2 337.92 51.2 C 399.36 51.2 450.56 97.28 450.56 163.84 C 450.56 245.76 389.12 332.8 256 430.08 Z" fill="url(#heartGradWhite)" />
    
    <!-- Heart Rate Line -->
    <path d="M 102.4 286.72 L 143.36 286.72 L 174.08 215.04 L 215.04 348.16 L 250.88 209.92 L 281.6 261.12 L 358.4 138.24" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrow Head -->
    <path d="M 307.2 122.88 L 384 122.88 L 384 199.68 Z" fill="#EF4444" stroke="#EF4444" stroke-width="10" stroke-linejoin="round" />
  </g>
</svg>
